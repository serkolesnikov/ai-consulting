media:
  input: assets
  output: assets

content:
  - name: site
    label: Настройки сайта
    type: file
    path: content/site.json
    fields:
      - name: site
        label: Контакты и общие настройки
        type: object
        fields:
          - { name: name, label: Имя, type: string }
          - { name: email, label: Email, type: string }
          - { name: telegram, label: "Telegram (без @)", type: string }
          - { name: phone, label: Телефон, type: string }
          - { name: linkedin, label: Ссылка на LinkedIn, type: string }
          - { name: portrait, label: Фото, type: image }
          - { name: formEndpoint, label: "Formspree endpoint (URL формы)", type: string, required: false }

      - name: logos
        label: Логотипы компаний
        type: object
        list: true
        fields:
          - { name: name, label: Название, type: string }
          - { name: image, label: Логотип, type: image }
          - { name: maxHeight, label: Высота логотипа, px, type: number }

      - name: testimonial
        label: Отзыв — аватар
        type: object
        fields:
          - { name: avatar, label: Фото автора отзыва, type: image }

      - name: en
        label: English
        type: object
        fields:
          - { name: eyebrow, label: Надзаголовок, type: string }
          - { name: heroTitle, label: Главный заголовок, type: string }
          - { name: heroSub, label: Подзаголовок, type: text }
          - { name: ctaPrimary, label: Кнопка 1, type: string }
          - { name: ctaSecondary, label: Кнопка 2, type: string }
          - { name: navAbout, label: "Меню: обо мне", type: string }
          - { name: navServices, label: "Меню: услуги", type: string }
          - { name: navProcess, label: "Меню: как работаю", type: string }
          - { name: navContact, label: "Меню: контакты", type: string }
          - { name: companiesLabel, label: Заголовок блока логотипов, type: string }
          - { name: testimonialsLabel, label: Заголовок блока отзывов, type: string }
          - { name: quote1, label: Текст отзыва, type: text }
          - { name: quote1Author, label: Автор отзыва, type: string }
          - { name: quote1Role, label: Должность автора, type: string }
          - name: creds
            label: Три карточки-факта
            type: object
            list: true
            fields:
              - { name: k, label: Подпись, type: string }
              - { name: t, label: Заголовок, type: string }
              - { name: d, label: Описание, type: text }
          - { name: aboutTitle, label: "Обо мне: заголовок", type: string }
          - { name: aboutP1, label: "Обо мне: абзац 1", type: text }
          - { name: aboutP2, label: "Обо мне: абзац 2", type: text }
          - name: diffs
            label: "Обо мне: отличия"
            type: object
            list: true
            fields:
              - { name: t, label: Заголовок, type: string }
              - { name: d, label: Описание, type: text }
          - { name: servicesTitle, label: "Услуги: заголовок", type: string }
          - { name: servicesSub, label: "Услуги: подзаголовок", type: text }
          - { name: deliverableLabel, label: "Подпись «Результат»", type: string }
          - name: services
            label: Услуги
            type: object
            list: true
            fields:
              - { name: n, label: Номер, type: string }
              - { name: t, label: Название, type: string }
              - { name: d, label: Описание, type: text }
              - { name: r, label: Результат, type: text }
          - { name: processTitle, label: "Как работаю: заголовок", type: string }
          - { name: processSub, label: "Как работаю: подзаголовок", type: text }
          - name: steps
            label: Этапы работы
            type: object
            list: true
            fields:
              - { name: n, label: Номер, type: string }
              - { name: t, label: Название, type: string }
              - { name: d, label: Описание, type: text }
          - { name: contactTitle, label: "Контакты: заголовок", type: string }
          - { name: contactSub, label: "Контакты: подзаголовок", type: text }
          - { name: fName, label: "Форма: имя", type: string }
          - { name: fEmail, label: "Форма: email", type: string }
          - { name: fCompany, label: "Форма: компания", type: string }
          - { name: fMessage, label: "Форма: сообщение", type: string }
          - { name: fSubmit, label: "Форма: кнопка", type: string }
          - { name: formIdle, label: "Форма: подсказка", type: text }
          - { name: formSent, label: "Форма: сообщение после отправки", type: text }
          - { name: linkedinValue, label: "Подпись LinkedIn-карточки", type: string }
          - { name: phoneLabel, label: "Подпись телефона", type: string }
          - { name: footerNote, label: Подвал, type: string }

