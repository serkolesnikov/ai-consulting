media:
  input: assets
  output: assets

content:
  - name: site
    label: Сайт
    type: file
    path: content/site.json
    fields:
      - name: site
        label: Контакты и общие настройки
        type: object
        fields:
          - { name: name, label: Имя, type: string }
          - { name: email, label: Email, type: string }
          - { name: telegram, label: "Telegram (без @)", type: string }
          - { name: phone, label: Телефон, type: string }
          - { name: linkedin, label: Ссылка на LinkedIn, type: string }
          - { name: portrait, label: Фото, type: image }
          - { name: formEndpoint, label: "Formspree endpoint (URL формы)", type: string, required: false }

      - name: logos
        label: "Логотипы (последний показан обрезанным)"
        type: object
        list: true
        fields:
          - { name: name, label: Название, type: string }
          - { name: image, label: Логотип, type: image }
          - { name: maxHeight, label: "Высота логотипа, px", type: number }

      - name: testimonial
        label: Отзыв — аватар
        type: object
        fields:
          - { name: avatar, label: Фото автора отзыва, type: image }

      - name: en
        label: English
        type: object
        fields:
          - { name: lead, label: "Главный посыл (жирная строка)", type: text }
          - { name: background, label: "Бэкграунд (тусклый абзац)", type: text }
          - { name: intro2, label: "Последние роли", type: text }
          - { name: cta, label: "Кнопка", type: string }
          - { name: companiesLabel, label: "Заголовок блока логотипов", type: string }
          - { name: andMore, label: "Подпись «и другие»", type: string }
          - { name: quote1, label: "Текст отзыва", type: text }
          - { name: quote1Author, label: "Автор отзыва", type: string }
          - { name: quote1Role, label: "Должность автора", type: string }
          - { name: helpTitle, label: "Заголовок «Чем помогаю»", type: string }
          - { name: help, label: "Список: чем помогаю", type: string, list: true }
          - { name: processTitle, label: "Заголовок «Как работаю»", type: string }
          - { name: processLine, label: "Как работаю: вступление", type: text }
          - name: phases
            label: "Этапы (Understand / Identify / Execute)"
            type: object
            list: true
            fields:
              - { name: t, label: Название, type: string }
              - { name: k, label: "Уточнение в скобках", type: string }
              - { name: d, label: Описание, type: text }
          - { name: processNote, label: "Как работаю: примечание", type: text }
          - { name: experienceTitle, label: "Заголовок «Опыт»", type: string }
          - name: roles
            label: Опыт
            type: object
            list: true
            fields:
              - { name: role, label: "Роль / место", type: string }
              - { name: d, label: Описание, type: text }
          - { name: contactTitle, label: "Заголовок «Контакты»", type: string }
          - { name: contactSub, label: "Контакты: текст", type: text }
          - { name: fName, label: "Форма: имя", type: string }
          - { name: fEmail, label: "Форма: email", type: string }
          - { name: fMessage, label: "Форма: сообщение", type: string }
          - { name: fSubmit, label: "Форма: кнопка", type: string }
          - { name: formIdle, label: "Форма: подсказка", type: text }
          - { name: formSent, label: "Форма: после отправки", type: text }
          - { name: formMailto, label: "Форма: если открылся почтовый клиент", type: text }
          - { name: formError, label: "Форма: сообщение об ошибке", type: text }
          - { name: footerNote, label: Подвал, type: string }

      - name: es
        label: Español
        type: object
        fields:
          - { name: lead, label: "Главный посыл (жирная строка)", type: text }
          - { name: background, label: "Бэкграунд (тусклый абзац)", type: text }
          - { name: intro2, label: "Последние роли", type: text }
          - { name: cta, label: "Кнопка", type: string }
          - { name: companiesLabel, label: "Заголовок блока логотипов", type: string }
          - { name: andMore, label: "Подпись «и другие»", type: string }
          - { name: quote1, label: "Текст отзыва", type: text }
          - { name: quote1Author, label: "Автор отзыва", type: string }
          - { name: quote1Role, label: "Должность автора", type: string }
          - { name: helpTitle, label: "Заголовок «Чем помогаю»", type: string }
          - { name: help, label: "Список: чем помогаю", type: string, list: true }
          - { name: processTitle, label: "Заголовок «Как работаю»", type: string }
          - { name: processLine, label: "Как работаю: вступление", type: text }
          - name: phases
            label: "Этапы (Understand / Identify / Execute)"
            type: object
            list: true
            fields:
              - { name: t, label: Название, type: string }
              - { name: k, label: "Уточнение в скобках", type: string }
              - { name: d, label: Описание, type: text }
          - { name: processNote, label: "Как работаю: примечание", type: text }
          - { name: experienceTitle, label: "Заголовок «Опыт»", type: string }
          - name: roles
            label: Опыт
            type: object
            list: true
            fields:
              - { name: role, label: "Роль / место", type: string }
              - { name: d, label: Описание, type: text }
          - { name: contactTitle, label: "Заголовок «Контакты»", type: string }
          - { name: contactSub, label: "Контакты: текст", type: text }
          - { name: fName, label: "Форма: имя", type: string }
          - { name: fEmail, label: "Форма: email", type: string }
          - { name: fMessage, label: "Форма: сообщение", type: string }
          - { name: fSubmit, label: "Форма: кнопка", type: string }
          - { name: formIdle, label: "Форма: подсказка", type: text }
          - { name: formSent, label: "Форма: после отправки", type: text }
          - { name: formMailto, label: "Форма: если открылся почтовый клиент", type: text }
          - { name: formError, label: "Форма: сообщение об ошибке", type: text }
          - { name: footerNote, label: Подвал, type: string }
